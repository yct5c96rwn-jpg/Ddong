<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>고래야</title>
<style>
  @font-face {
    font-family: 'DungGeunMo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #ffffff;
    font-family: 'DungGeunMo', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    color: #333;
  }
  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    overflow: hidden;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }
  .hidden { display: none !important; }

  /* ---------- password screen ---------- */
  #passwordScreen p.pw-label {
    font-size: 9vw;
    margin: 0 0 24px 0;
    letter-spacing: 1px;
  }
  #passwordInput {
    font-family: 'DungGeunMo', sans-serif;
    font-size: 7vw;
    text-align: center;
    border: 3px solid #333;
    border-radius: 14px;
    padding: 10px 16px;
    width: 55vw;
    max-width: 260px;
    outline: none;
    background: #fff;
    color: #333;
  }
  #passwordInput.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* ---------- title screen ---------- */
  #titleScreen h1 {
    font-size: 16vw;
    margin: 0 0 48px 0;
    color: #f0a83c;
    text-shadow: 3px 3px 0 #333;
  }
  #startBtn {
    font-family: 'DungGeunMo', sans-serif;
    font-size: 6.5vw;
    padding: 14px 44px;
    background: #ffd97d;
    border: 4px solid #333;
    border-radius: 18px;
    cursor: pointer;
    color: #333;
  }
  #startBtn:active { transform: scale(0.94); }

  /* ---------- game screen ---------- */
  #gameScreen { justify-content: flex-start; }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 16px;
    z-index: 30;
    pointer-events: none;
  }
  #timerDisplay, #scoreDisplay {
    background: rgba(255,255,255,0.85);
    padding: 6px 14px;
    border-radius: 12px;
    border: 2px solid #333;
    font-size: 4.6vw;
  }
  #hint {
    position: absolute;
    top: 60px; left: 0; right: 0;
    text-align: center;
    font-size: 3.2vw;
    color: #999;
    z-index: 25;
    pointer-events: none;
    transition: opacity 1s;
  }
  #gameArea {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .falling {
    position: absolute;
    top: -120px;
    pointer-events: none;
  }
  #character {
    position: absolute;
    bottom: 18px;
    pointer-events: none;
    z-index: 10;
  }
  .float-score {
    position: absolute;
    font-size: 5.5vw;
    color: #ff8c1a;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    pointer-events: none;
    z-index: 40;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-46px); }
  }
  #timeoutBanner {
    position: absolute;
    top: 42%; left: 0; right: 0;
    text-align: center;
    font-size: 13vw;
    color: #e0524f;
    text-shadow: 3px 3px 0 #333;
    z-index: 50;
  }

  /* ---------- end screen ---------- */
  #endScreen { text-align: center; padding: 16px; }
  #endEmojis { font-size: 13vw; margin-bottom: 6px; line-height: 1; }
  #endImage {
    max-width: 72vw;
    max-height: 34vh;
    border-radius: 14px;
    border: 3px solid #333;
    margin: 10px 0;
    object-fit: cover;
  }
  #endScoreText { font-size: 5.5vw; margin: 6px 0 14px 0; }
  #endLink {
    font-size: 3.6vw;
    color: #3366cc;
    word-break: break-all;
    display: inline-block;
    margin-bottom: 20px;
    max-width: 80vw;
  }
  #retryBtn {
    font-family: 'DungGeunMo', sans-serif;
    font-size: 4.5vw;
    padding: 10px 28px;
    background: #eee;
    border: 3px solid #333;
    border-radius: 14px;
    cursor: pointer;
    color: #333;
  }
</style>
</head>
<body>
<div id="app">

  <div id="passwordScreen" class="screen">
    <p class="pw-label">비밀번호?</p>
    <input type="text" id="passwordInput" inputmode="numeric" autocomplete="off" maxlength="8" />
  </div>

  <div id="titleScreen" class="screen hidden">
    <h1>고래야</h1>
    <button id="startBtn">시작</button>
  </div>

  <div id="gameScreen" class="screen hidden">
    <div id="hud">
      <div id="timerDisplay">02:00</div>
      <div id="scoreDisplay">0점</div>
    </div>
    <div id="hint">← → 또는 드래그로 이동해서 생선을 피해요</div>
    <div id="gameArea">
      <img id="character" src="" alt="캐릭터" />
    </div>
    <div id="timeoutBanner" class="hidden">타임아웃!</div>
  </div>

  <div id="endScreen" class="screen hidden">
    <div id="endEmojis"></div>
    <img id="endImage" src="" alt="결과 이미지" />
    <div id="endScoreText"></div>
    <a id="endLink" href="#" target="_blank" rel="noopener noreferrer"></a>
    <br/>
    <button id="retryBtn">다시하기</button>
  </div>

</div>

/* ---------- DOM refs ---------- */
const passwordScreen = document.getElementById('passwordScreen');
const passwordInput  = document.getElementById('passwordInput');
const titleScreen    = document.getElementById('titleScreen');
const startBtn       = document.getElementById('startBtn');
const gameScreen     = document.getElementById('gameScreen');
const gameArea       = document.getElementById('gameArea');
const characterEl    = document.getElementById('character');
const timerDisplay   = document.getElementById('timerDisplay');
const scoreDisplay   = document.getElementById('scoreDisplay');
const hintEl         = document.getElementById('hint');
const timeoutBanner  = document.getElementById('timeoutBanner');
const endScreen      = document.getElementById('endScreen');
const endEmojis      = document.getElementById('endEmojis');
const endImage       = document.getElementById('endImage');
const endScoreText   = document.getElementById('endScoreText');
const endLink        = document.getElementById('endLink');
const retryBtn       = document.getElementById('retryBtn');

/* ---------- audio ---------- */
const sndGoraeya = new Audio(SND_GORAEYA);
sndGoraeya.loop = true;
const sndBurn = new Audio(SND_BURN);
sndBurn.loop = true;

let audioCtx = null;
function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq, duration, type, vol, delay) {
  delay = delay || 0;
  const ctx = ensureAudioCtx();
  setTimeout(() => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = vol != null ? vol : 0.25;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }, delay);
}

function playClickSound()   { beep(520, 0.09, 'square', 0.22); }
function playWarnSound()    { beep(880, 0.14, 'sine', 0.28); }
function playTimeoutSound() {
  beep(700, 0.14, 'sawtooth', 0.25, 0);
  beep(500, 0.14, 'sawtooth', 0.25, 140);
  beep(320, 0.22, 'sawtooth', 0.25, 280);
}

/* ---------- password screen ---------- */
passwordInput.addEventListener('input', () => {
  const v = passwordInput.value.trim();
  if (v === '1205') {
    passwordScreen.classList.add('hidden');
    titleScreen.classList.remove('hidden');
  } else if (v.length >= 4) {
    passwordInput.classList.add('shake');
    setTimeout(() => {
      passwordInput.classList.remove('shake');
      passwordInput.value = '';
    }, 300);
  }
});

/* ---------- title screen ---------- */
startBtn.addEventListener('click', () => {
  ensureAudioCtx();
  playClickSound();
  titleScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  setTimeout(startGame, 120);
  setTimeout(() => { hintEl.style.opacity = '0'; }, 3500);
});

/* ---------- game constants ---------- */
const GAME_DURATION   = 120;   // seconds
const SPRITE_INTERVAL = 800;   // ms, slightly faster feel than 1s cycle pace
const FISH_MIN_GAP    = 550;   // ms between fish spawns
const FISH_MAX_GAP    = 950;
const WHALE_MIN_GAP   = 10000; // ms between whale spawns
const WHALE_MAX_GAP   = 15000;
const WHALE_RESCUE_MS = 4500;  // if stuck in hit-state this long, force a whale
const WHALE_BONUS     = 15;
const SCORE_TICK_MS   = 500;   // +1 point every tick while normal (=> 2 pts/sec)
const WIN_THRESHOLD   = 125;

/* ---------- state ---------- */
let charState = 'normal'; // 'normal' | 'hit'
let running = false;
let score = 0;
let timeLeft = GAME_DURATION;
let charWidth = 0, charHeight = 0, areaWidth = 0, areaHeight = 0;
let charX = 0; // left offset in px
const moveKeys = { left: false, right: false };
const MOVE_SPEED = 7; // px per frame

let spriteTimer = null;
let fishTimer = null;
let whaleTimer = null;
let scoreTimer = null;
let clockTimer = null;
let rafId = null;
let lastWhaleAt = 0;

const fallingObjects = []; // { el, x, y, speed, type, w, h }

/* ---------- helpers ---------- */
function fmtTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return m + ':' + sec;
}

function updateHud() {
  scoreDisplay.textContent = score + '점';
  timerDisplay.textContent = fmtTime(Math.max(0, timeLeft));
}

function setCharSprite(src) {
  characterEl.src = src;
}

function sizeCharacter() {
  areaWidth = gameArea.clientWidth;
  areaHeight = gameArea.clientHeight;
  charWidth = Math.max(90, Math.min(areaWidth * 0.30, 190));
  characterEl.style.width = charWidth + 'px';
  charHeight = charWidth * 1.25;
  charX = (areaWidth - charWidth) / 2;
  characterEl.style.left = charX + 'px';
}

/* ---------- character sprite animation ---------- */
let spriteFrame = 0;
function startSpriteLoop() {
  clearInterval(spriteTimer);
  spriteTimer = setInterval(() => {
    if (charState !== 'normal') return;
    spriteFrame = 1 - spriteFrame;
    setCharSprite(spriteFrame === 0 ? IMG1 : IMG2);
  }, SPRITE_INTERVAL);
}

/* ---------- movement ---------- */
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  moveKeys.left = true;
  if (e.key === 'ArrowRight') moveKeys.right = true;
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft')  moveKeys.left = false;
  if (e.key === 'ArrowRight') moveKeys.right = false;
});

function dragHandler(clientX) {
  if (!running) return;
  const rect = gameArea.getBoundingClientRect();
  let x = clientX - rect.left - charWidth / 2;
  x = Math.max(0, Math.min(areaWidth - charWidth, x));
  charX = x;
}
gameArea.addEventListener('pointerdown', (e) => { dragHandler(e.clientX); });
gameArea.addEventListener('pointermove', (e) => {
  if (e.buttons === 1 || e.pointerType === 'touch') dragHandler(e.clientX);
});

/* ---------- spawning ---------- */
function spawnFish() {
  if (!running) return;
  const w = Math.max(46, areaWidth * 0.11);
  const el = document.createElement('img');
  el.src = IMG4;
  el.className = 'falling';
  el.style.width = w + 'px';
  const x = Math.random() * (areaWidth - w);
  el.style.left = x + 'px';
  el.style.top = '-100px';
  gameArea.appendChild(el);
  const speed = 160 + Math.random() * 140; // px/sec
  fallingObjects.push({ el, x, y: -100, w, h: w * 1.1, speed, type: 'fish' });

  const nextGap = FISH_MIN_GAP + Math.random() * (FISH_MAX_GAP - FISH_MIN_GAP);
  fishTimer = setTimeout(spawnFish, nextGap);
}

function spawnWhale() {
  if (!running) return;
  const w = Math.max(70, areaWidth * 0.20);
  const el = document.createElement('img');
  el.src = IMG5;
  el.className = 'falling';
  el.style.width = w + 'px';
  const x = Math.random() * (areaWidth - w);
  el.style.left = x + 'px';
  el.style.top = '-140px';
  gameArea.appendChild(el);
  const speed = 130 + Math.random() * 70;
  fallingObjects.push({ el, x, y: -140, w, h: w * 0.78, speed, type: 'whale' });
  lastWhaleAt = performance.now();

  const nextGap = WHALE_MIN_GAP + Math.random() * (WHALE_MAX_GAP - WHALE_MIN_GAP);
  whaleTimer = setTimeout(spawnWhale, nextGap);
}

/* ---------- floating score text ---------- */
function showFloatScore(x, y, text) {
  const div = document.createElement('div');
  div.className = 'float-score';
  div.textContent = text;
  div.style.left = x + 'px';
  div.style.top = y + 'px';
  gameArea.appendChild(div);
  setTimeout(() => div.remove(), 950);
}

/* ---------- hit / revive ---------- */
function onHitByFish() {
  if (charState !== 'normal') return;
  charState = 'hit';
  setCharSprite(IMG3);
  sndGoraeya.pause();
  sndBurn.currentTime = 0;
  sndBurn.play().catch(() => {});
}

function onEatWhale(cx, cy) {
  score += WHALE_BONUS;
  updateHud();
  showFloatScore(cx, cy, '+' + WHALE_BONUS);
  if (charState === 'hit') {
    charState = 'normal';
    sndBurn.pause();
    sndGoraeya.play().catch(() => {});
    spriteFrame = 0;
    setCharSprite(IMG1);
  }
}

/* ---------- main loop ---------- */
let lastTs = null;
function gameLoop(ts) {
  if (!running) return;
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(48, ts - lastTs) / 1000;
  lastTs = ts;

  // move character
  if (moveKeys.left)  charX -= MOVE_SPEED;
  if (moveKeys.right) charX += MOVE_SPEED;
  charX = Math.max(0, Math.min(areaWidth - charWidth, charX));
  characterEl.style.left = charX + 'px';

  const charBottom = areaHeight - 18;
  const charTop = charBottom - charHeight;
  const charLeft = charX;
  const charRight = charX + charWidth;

  // rescue mechanic: force-spawn a whale if stuck too long in hit-state
  if (charState === 'hit' && performance.now() - lastWhaleAt > WHALE_RESCUE_MS) {
    lastWhaleAt = performance.now();
    spawnWhale_forced();
  }

  for (let i = fallingObjects.length - 1; i >= 0; i--) {
    const obj = fallingObjects[i];
    obj.y += obj.speed * dt;
    obj.el.style.top = obj.y + 'px';

    // collision check (simple AABB, slightly shrunk for fairness)
    const pad = 10;
    const objLeft = obj.x + pad, objRight = obj.x + obj.w - pad;
    const objTop = obj.y + pad, objBottom = obj.y + obj.h - pad;
    const overlap = objLeft < charRight && objRight > charLeft &&
                    objTop < charBottom && objBottom > charTop;

    if (overlap) {
      if (obj.type === 'fish') {
        onHitByFish();
      } else if (obj.type === 'whale') {
        onEatWhale(charX + charWidth / 2 - 20, charTop - 10);
      }
      obj.el.remove();
      fallingObjects.splice(i, 1);
      continue;
    }

    if (obj.y > areaHeight + 40) {
      obj.el.remove();
      fallingObjects.splice(i, 1);
    }
  }

  rafId = requestAnimationFrame(gameLoop);
}

function spawnWhale_forced() {
  if (!running) return;
  clearTimeout(whaleTimer);
  spawnWhale();
}

/* ---------- score / timer ticking ---------- */
function tickScore() {
  if (charState === 'normal') {
    score += 1;
    updateHud();
  }
}

function tickClock() {
  timeLeft -= 1;
  updateHud();
  if (timeLeft === 60 || timeLeft === 30) {
    playWarnSound();
  }
  if (timeLeft <= 0) {
    endGameByTimeout();
  }
}

/* ---------- start / end ---------- */
function startGame() {
  sizeCharacter();
  spriteFrame = 0;
  charState = 'normal';
  setCharSprite(IMG1);
  score = 0;
  timeLeft = GAME_DURATION;
  updateHud();
  running = true;
  lastTs = null;

  sndGoraeya.currentTime = 0;
  sndGoraeya.play().catch(() => {});

  startSpriteLoop();
  fishTimer = setTimeout(spawnFish, 400);
  lastWhaleAt = performance.now();
  whaleTimer = setTimeout(spawnWhale, 6000 + Math.random() * 3000);
  scoreTimer = setInterval(tickScore, SCORE_TICK_MS);
  clockTimer = setInterval(tickClock, 1000);
  rafId = requestAnimationFrame(gameLoop);

  window.addEventListener('resize', sizeCharacter);
}

function stopAllTimers() {
  running = false;
  clearInterval(spriteTimer);
  clearTimeout(fishTimer);
  clearTimeout(whaleTimer);
  clearInterval(scoreTimer);
  clearInterval(clockTimer);
  if (rafId) cancelAnimationFrame(rafId);
}

function endGameByTimeout() {
  stopAllTimers();
  playTimeoutSound();
  sndGoraeya.pause();
  sndBurn.pause();
  timeoutBanner.classList.remove('hidden');

  setTimeout(() => {
    showEndScreen();
  }, 1600);
}

function showEndScreen() {
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  endScoreText.textContent = '최종 점수: ' + score + '점';

  if (score >= WIN_THRESHOLD) {
    endEmojis.textContent = '🐳🐳🐳';
    endImage.src = IMG6;
    endLink.href = 'https://youtu.be/kQUP6xD7E6E?feature=shared';
    endLink.textContent = 'https://youtu.be/kQUP6xD7E6E?feature=shared';
    sndGoraeya.loop = false;
    sndGoraeya.currentTime = 0;
    sndGoraeya.play().catch(() => {});
  } else {
    endEmojis.textContent = '🔥🔥🔥';
    endImage.src = IMG7;
    endLink.href = 'https://youtu.be/7-xyGAe6j3A?feature=shared';
    endLink.textContent = 'https://youtu.be/7-xyGAe6j3A?feature=shared';
    sndBurn.loop = false;
    sndBurn.currentTime = 0;
    sndBurn.play().catch(() => {});
  }
}

retryBtn.addEventListener('click', () => {
  window.location.reload();
});

</script>
